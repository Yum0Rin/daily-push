<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>每日推送 · Daily Push</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>每日推送</h1>
    <div class="brand-actions">
      <a id="settingsLink" class="ghost" href="/settings" title="设置">⚙️</a>
      <button id="themeToggle" class="ghost" title="切换主题">🌙</button>
    </div>
  </div>
  <nav class="datebar">
    <button id="prevDay" class="ghost">◀</button>
    <input type="date" id="datePicker">
    <button id="nextDay" class="ghost">▶</button>
  </nav>
</header>

<main>
  <div id="summary" class="summary"></div>

  <section class="card" id="card-music" style="display:none">
    <h2>🎵 网易云日推</h2>
    <div class="cf" id="cfMusic" tabindex="0">
      <div class="cf-viewport">
        <div class="cf-stage">
          <ol class="cf-track" id="songs"></ol>
        </div>
      </div>
      <div class="cf-bar">
        <button type="button" class="ghost cf-nav" id="cfPrev" aria-label="上一首">◀</button>
        <span class="cf-counter" id="cfCounter"></span>
        <button type="button" class="ghost cf-nav" id="cfNext" aria-label="下一首">▶</button>
      </div>
      <div class="cf-caption" id="cfCaption" aria-live="polite"></div>
    </div>
    <div class="cf-note" id="cfNote" style="display:none"></div>
  </section>

  <section class="card" id="card-bili" style="display:none">
    <h2>📺 B站 UP动态</h2>
    <ul class="cardgrid" id="ups"></ul>
  </section>

  <section class="card" id="card-bilirec" style="display:none">
    <h2>🔥 B站推荐（未关注）</h2>
    <ul class="cardgrid" id="biliRecList"></ul>
  </section>

  <section class="card" id="card-xhs" style="display:none">
    <h2>📕 小红书推荐</h2>
    <ul class="cardgrid xhs" id="xhsList"></ul>
  </section>

  <section class="card" id="card-mp" style="display:none">
    <h2>📰 微信公众号推文</h2>
    <ul class="cardgrid mp" id="mpList"></ul>
  </section>

  <p id="emptyState" class="empty" style="display:none">该日暂无推送记录，每日开机自动采集。</p>
</main>

<script src="/static/app.js"></script>
</body>
</html>
