<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>每日推送 · Daily Push</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --card: #181b22;
  --card-2: #1f232c;
  --text: #e6e8ee;
  --muted: #9aa1b0;
  --accent: #2f9b8a;
  --accent-2: #5fc4b0;
  --green: #7ed4c2;
  --green-deep: #3f8f80;
  --green-darker: #2f7c6f;
  --amber: #fbbf24;
  --red: #f87171;
  --border: #2a2f3a;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6fa;
  --card: #ffffff;
  --card-2: #f0f1f6;
  --text: #1c1f27;
  --muted: #5b6372;
  --accent: #1f7a6c;
  --accent-2: #2f9b8a;
  --green: #15967f;
  --green-deep: #1a6b5e;
  --green-darker: #125850;
  --amber: #b45309;
  --red: #dc2626;
  --border: #e2e5ec;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
  transition: background .2s, color .2s;
}
header {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; justify-content: space-between; }
.brand-actions { display: flex; align-items: center; gap: 8px; }
.brand-actions a.ghost { text-decoration: none; line-height: 1; }
.brand h1 { font-size: 20px; margin: 0; padding-left: 2.5em; }
.datebar {
  position: relative;
  display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap;
}
.datebar input[type=date] {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  accent-color: var(--accent);
}
#dpPopup {
  position: fixed; top: 0; left: 0; z-index: 60; display: none;
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
}
#dpPopup.open { display: block; }
.dp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.dp-head .ghost { padding: 2px 8px; font-size: 13px; }
.dp-label { font-size: 13px; font-weight: 600; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 36px); gap: 2px; text-align: center; }
.dp-grid .dow { font-size: 11px; color: var(--muted); padding: 2px 0; }
.dp-grid button {
  height: 30px; border-radius: 8px; font-size: 13px; padding: 0;
  background: none; color: var(--text);
}
.dp-grid button:hover { background: var(--card-2); }
.dp-grid button.weekend { color: var(--accent-2); }
.dp-grid button.today { font-weight: 700; color: var(--accent); }
.dp-grid button.selected { background: var(--accent); color: #fff; font-weight: 700; }
.dp-grid button.selected.weekend { color: #fff; }
.dp-grid button.out { visibility: hidden; }
main { max-width: 880px; margin: 0 auto; padding: 20px; }
.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap: 12px; margin-bottom: 20px;
}
.stat {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px;
}
button.stat {
  color: var(--text); text-align: left; width: 100%;
  cursor: pointer; transition: border-color .2s, transform .1s;
}
button.stat:hover { border-color: var(--accent-2); }
button.stat:active { transform: scale(.97); }
button.stat .value { margin-top: 4px; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat .delta { font-size: 12px; color: var(--green); }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
}
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.songs {
  margin: 0; padding: 0; list-style: none; counter-reset: song;
  max-height: min(440px, 78vh); overflow-y: auto;  /* 内滚动：约显示前 5 首，且不超过一屏 */
}
.songs li {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 6px; border-bottom: 1px dashed var(--border);
}
.songs li:last-child { border-bottom: none; }
.songs .rank {
  counter-increment: song; flex: 0 0 28px; color: var(--green-darker);
  font-weight: 700; font-size: 16px;
}
.songs .rank::before { content: counter(song); }
.songs img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
.songs .meta { flex: 1; }
.songs .title { font-weight: 600; }
.songs .artist { font-size: 13px; color: var(--muted); }
.songs .comment {
  font-size: 13px; color: var(--muted);
  margin-top: 2px; font-style: italic;
  max-width: 42em;
}
.songs .stats { display: flex; gap: 10px; margin-top: 2px; font-size: 12px; color: var(--muted); }
.songs .cstat { white-space: nowrap; }
.songs a { text-decoration: none; color: var(--green-darker); font-size: 13px; }

.module-err {
  padding: 14px 16px; border-radius: 10px;
  border: 1px dashed var(--border); background: var(--card-2);
}
.module-err-title { font-weight: 600; color: var(--accent-2); margin-bottom: 4px; }
.module-err-desc { font-size: 13px; color: var(--muted); }
.module-err-raw {
  margin-top: 8px; font-size: 11px; color: var(--muted);
  word-break: break-all; opacity: .7;
}
.module-note {
  padding: 14px 16px; border-radius: 10px;
  border: 1px dashed var(--border); background: var(--card-2);
  font-size: 13px; color: var(--muted);
}

.badge-updated, .badge-idle, .badge-err {
  font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: auto; flex-shrink: 0;
}
.badge-updated { background: rgba(52,211,153,.15); color: var(--green); }
.badge-idle { background: var(--card-2); color: var(--muted); }
.badge-err { background: rgba(248,113,113,.15); color: var(--red); }

.group-block { margin-bottom: 14px; }
.group-block .gname { font-weight: 600; margin-bottom: 4px; color: var(--accent-2); }
.group-block pre {
  margin: 0; white-space: pre-wrap; word-break: break-word;
  background: var(--card-2); padding: 10px 12px; border-radius: 8px;
  font-family: inherit; font-size: 13px; max-height: 260px; overflow-y: auto;
}
.msg-line { padding: 3px 0; border-bottom: 1px dashed var(--border); }
.msg-line:last-child { border-bottom: none; }
.msg-time { color: var(--muted); font-size: 12px; margin-right: 8px; }
.msg-sender { color: var(--accent-2); font-weight: 600; margin-right: 6px; }
.msg-text { color: var(--text); }

/* 卡片网格（B站视频 / 公众号推文共用）：窄屏 2 列、宽屏 3 列（最多 3、最少 2） */
.cardgrid {
  margin: 0; padding: 0; list-style: none;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
@media (min-width: 620px) { .cardgrid { grid-template-columns: repeat(3, 1fr); } }
.cardgrid .gcard {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
}
.cardgrid .gcard.notify { opacity: .65; }
.cardgrid .gthumb { display: block; aspect-ratio: 16 / 9; background: var(--card); overflow: hidden; }
.cardgrid .gthumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
.cardgrid .gthumb-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 66px; color: var(--muted);
  background: linear-gradient(135deg, var(--card-2), var(--card));
}
/* 公众号：卡片比 B站更宽（窄屏 1 列、宽屏 2 列），封面按微信 2.35:1 完整显示 */
.cardgrid.mp { grid-template-columns: 1fr; }
@media (min-width: 620px) { .cardgrid.mp { grid-template-columns: repeat(2, 1fr); } }
.cardgrid.mp .gthumb { aspect-ratio: 2.35 / 1; }
/* 公众号标题固定两行：单行也占两行高，超出显示省略号 */
.cardgrid.mp .gtitle { min-height: 2.8em; }
.cardgrid .ginfo { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
.cardgrid .gtitle {
  color: var(--text); font-weight: 500; text-decoration: none;
  font-size: 13px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cardgrid .gtitle:hover { color: var(--accent-2); }
.cardgrid .gmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.cardgrid .gmeta .author { color: var(--green-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cardgrid > .module-note, .cardgrid > .module-err { grid-column: 1 / -1; }

.empty { text-align: center; color: var(--muted); padding: 40px; }
footer {
  max-width: 880px; margin: 0 auto; padding: 20px;
  display: flex; align-items: center; gap: 12px;
}
button {
  cursor: pointer; border: none; border-radius: 10px;
  background: var(--accent); color: #fff; padding: 10px 16px; font-size: 14px;
  transition: transform .1s, opacity .2s;
}
button:active { transform: scale(.97); }
button.ghost, a.ghost {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border); padding: 6px 12px;
}
a.ghost {
  display: inline-block; border-radius: 10px;
  text-decoration: none; line-height: 1.4;
}
a.ghost:hover { border-color: var(--accent-2); }
button:disabled { opacity: .5; cursor: not-allowed; }
#collectMsg { color: var(--muted); font-size: 13px; }
.error-banner { color: var(--red); font-size: 13px; padding: 8px; }

#backTop {
  position: fixed; right: 20px; bottom: 20px; z-index: 50;
  width: 42px; height: 42px; border-radius: 50%; padding: 0;
  background: var(--accent); color: #fff; font-size: 18px;
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s;
}
#backTop.show { display: flex; opacity: 1; transform: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>每日推送</h1>
    <div class="brand-actions">
      <button id="themeToggle" class="ghost" title="切换主题">🌙</button>
    </div>
  </div>
  <nav class="datebar">
    <button id="prevDay" class="ghost">◀</button>
    <input type="date" id="datePicker">
    <button id="nextDay" class="ghost">▶</button>
  </nav>
</header>

<main>
  <div id="summary" class="summary"></div>

  <section class="card" id="card-music" style="display:none">
    <h2>🎵 网易云日推</h2>

  <section class="card" id="card-bili" style="display:none">

  </section>

  <section class="card" id="card-mp" style="display:none">
    <h2>📰 微信公众号推文</h2>
    <ul class="cardgrid mp" id="mpList"></ul>
  </section>

  <p id="emptyState" class="empty" style="display:none">该日暂无推送记录，每日开机自动采集。</p>
</main>

第一人民医院，多动与注意力缺陷障碍门诊，孙小焕态度很好，可开盐酸哌甲酯缓释咀嚼片。”\n\n佛山\n\n“佛山三院张杏莲医生无法确诊单独18岁成年之后的患者，因为没有量表，想要确诊必须得有家长陪同。她推荐我去中山三院，广东省医，广州脑科医院，她说这三个医院有成人的量表，可以患者独自疗诊。”\n\n北京\n\n“我是北京回龙观医院的普通精神科（含抑郁症）门诊的付作册大夫那确诊ADHD。”\n\n湖南\n\n“中南大学湘雅二医院儿童保健科多动症门诊龚潇湘医生可以诊断ADHD（但是如果伴随过于明显的情绪问题，可能不太适合）。”\n\n“中南大学湘雅二医院儿童青少年精神心理门诊罗学荣医生可以诊断ADHD。药房中存有择思达与专注达。”\n\n“湖南省第二人民医院精神科蒋铁平医生可以诊断ADHD。且药房中存有择思达。（不过医生比较喜欢插嘴）”\n\n江西\n\n“江西省儿童医院儿童保健/心理行为科中有部分医生标注可诊断ADHD，药房中存有贯注和择思达。”", "url": "http://mp.weixin.qq.com/s?__biz=MzIyMzgyMjY5NQ==&mid=2247577132&idx=1&sn=0ed39dd5ae55698cb23d18fdfa2b09b1&chksm=e949763a9ad1561da7c779eb6b1f89f009e78fc4c301874f5c97e5af75241934f7cec265a592&scene=0&xtrack=1#rd", "author": "青衫Neuro", "pic": "", "notify": false, "time": "08-23 11:44", "timestamp": 1787456654}, {"title": "一周没逛 GitHub 不要紧，这 TOP 10 的热门开源项目整理好了。", "url": "http://mp.weixin.qq.com/s?__biz=MzUxNjg4NDEzNA==&mid=2247536122&idx=1&sn=b7a284d06296707235d8dde07c6f6d4e&chksm=f8c85789fe92d2e849936c4aca345822ae57b225dda2fdc5b5ccd135206442b926769aa15792&scene=0&xtrack=1#rd", "author": "逛逛GitHub", "notify": false, "time": "08-23 11:34", "timestamp": 1787456069, "pic": "https://mmbiz.qpic.cn/sz_mmbiz_jpg/M2ibDBMdECU2ZegDFYNZvqmsaZNwqJmWW7dOfnunGYBib6tSDoibkMYE54TqX7tAIvcJoq7ZWPCmAlLdqUe10L66ZcRGCs5pqtjBsQ5gTU42SQ/640?wxtype=jpeg&wxfrom=0"}, {"title": "NO.4367 折个高级些的武士头盔吧", "url": "http://mp.weixin.qq.com/s?__biz=MjM5NzAwMjQ0NA==&mid=2651490259&idx=1&sn=b221a4b0427ba07b613b40a446070bbc&chksm=bc4af999641a009f6099ead791fb205ac6a4322458f1431a3257767d0b1da28aa5b94bf76dac&scene=0&xtrack=1#rd", "author": "白叔的折纸日记", "notify": false, "time": "08-23 10:02", "timestamp": 1787450575, "pic": "https://mmbiz.qpic.cn/sz_mmbiz_jpg/bib3fvXVibKpKRhPTy0E9WRu1C3jgicfF7rQouQ8jz9E0TcakTz5JeA37N8Libs1khHsCcq0u2BAGhaopXnNSdSWTEnOBOR7cOJibDQm2kiarI0dQ/640?wxtype=jpeg&wxfrom=0"}]}, "2026-08-22": {"netease": [{"id": 1388999487, "name": "太空", "artists": "吴青峰", "album": "太空人", "duration_ms": 226766, "pic": "https://p3.music.126.net/rMHp-kMLvnG6F3s8o79qww==/10995116856526 <script>
// Daily Push dashboard app.
const $ = (id) => document.getElementById(id);

const DAYS = window.__DAYS__ || null;

const els = {
  datePicker: $("datePicker"),
  summary: $("summary"),
  songs: $("songs"),
  ups: $("ups"),
  mpList: $("mpList"),
  cardMusic: $("card-music"),
  cardBili: $("card-bili"),
  cardMp: $("card-mp"),
  emptyState: $("emptyState"),
  collectBtn: $("collectBtn"),
  collectMsg: $("collectMsg"),
};

function localDateStr() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

let currentDate = DAYS
  ? (Object.keys(DAYS).sort().pop() || localDateStr())
  : localDateStr();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function errMessage(kind, raw) {
  const r = String(raw || "");
  const credential = /cookie|sessdata|not configured|login|401|403|expired|失效|过期/i.test(r);
  const conn = /cannot reach|connect|refused|timeout|ECONN|网络|unable to determine/i.test(r);
  if (kind === "mp") {
    if (credential) return "微信公众号登录凭证可能已失效，请更新后重新采集。";
    if (conn) return "微信数据源暂时无法连接，请稍后再试。";
    return "公众号推文获取失败，请稍后重试。";
  }
  if (kind === "netease") {
    if (credential) return "网易云登录凭证可能已失效，请更新 Cookie 后重新采集。";
    if (conn) return "网易云服务暂时无法连接，请稍后再试。";
    return "网易云推荐获取失败，请稍后重试。";
  }
  if (kind === "bilibili") {
    if (credential) return "B站登录凭证可能已失效，请更新 sessdata 后重新采集。";
    if (conn) return "B站接口暂时无法连接，请稍后再试。";
    return "B站动态获取失败，请稍后重试。";
  }
  return "数据获取失败，请稍后重试。";
}

function errBlock(kind, raw) {
  return `<div class="module-err">
    <div class="module-err-title">⚠️ 该模块暂时无法加载</div>
    <div class="module-err-desc">${esc(errMessage(kind, raw))}</div>
    ${raw ? `<div class="module-err-raw">${esc(raw)}</div>` : ""}
  </div>`;
}

function fmtCreated(ts) {
  const sec = Number(ts);
  if (!sec) return "";
  const d = new Date(sec * 1000);
  const y = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  const nowY = new Date().getFullYear();
  return `${y === nowY ? "" : y + "-"}${mm}-${dd} ${hh}:${mi}`;
}

function renderMsg(m) {
  if (typeof m === "string") {
    return `<div class="msg-line">${esc(m)}</div>`;
  }
  const t = m.time, s = m.sender || "", x = m.text || "";
  return `<div class="msg-line">
    ${t ? `<span class="msg-time">${esc(t)}</span>` : ""}
    ${s ? `<span class="msg-sender">${esc(s)}</span>` : ""}
    <span class="msg-text">${esc(x)}</span>
  </div>`;
}

function renderGroups(el, groups) {
  if (!Array.isArray(groups) || groups.length === 0) return false;
  el.innerHTML = groups.map((g) => {
    const msgs = (g.messages || []).map(renderMsg).join("");
    return `<div class="group-block">
      <div class="gname">${esc(g.group || g.name || g.peer || "")}</div>
      ${msgs || `<pre>（昨日无文本消息）</pre>`}
    </div>`;
  }).join("");
  return true;
}

function fmtCount(n, icon) {
  if (n === null || n === undefined || n === "") return "";
  const v = Number(n);
  if (!isFinite(v)) return "";
  const txt = v >= 10000 ? (v / 10000).toFixed(1).replace(/\.0$/, "") + "w" : String(v);
  return `<span class="cstat">${icon} ${txt}</span>`;
}

function renderMusic(data) {
  const isErr = data && typeof data === "object" && !Array.isArray(data) && data.error;
  const list = Array.isArray(data) ? data.filter((s) => !s.hidden) : [];
  els.cardMusic.style.display = (isErr || list.length > 0) ? "" : "none";
  if (isErr) {
    els.songs.innerHTML = errBlock("netease", data.error);
    return;
  }
  els.songs.innerHTML = list.map((s) => {
    const pic = (s.pic || "").replace(/^http:/, "https:");
    return `
        <li>
          <span class="rank"></span>
          ${pic ? `<img src="${esc(pic)}" loading="lazy" onerror="this.style.display='none'">` : ""}
          <div class="meta">
            <div class="title">${esc(s.name)}</div>
            <div class="artist">${esc(s.artists)}${s.album ? " · " + esc(s.album) : ""}</div>
            ${(s.favorite_count != null || s.comment_count != null)
              ? `<div class="stats">${fmtCount(s.favorite_count, "❤️")}${fmtCount(s.comment_count, "💬")}</div>` : ""}
            ${s.hot_comment ? `<div class="comment">"${esc(s.hot_comment)}"</div>` : ""}
          </div>
          ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">▶ 播放</a>` : ""}
        </li>`;
  }).join("");
}

function renderBili(data) {
  const isErr = data && typeof data === "object" && !Array.isArray(data) && data.error;
  const list = Array.isArray(data) ? data.filter((u) => !u.hidden) : [];
  els.cardBili.style.display = (isErr || list.length > 0) ? "" : "none";
  if (isErr) {
    els.ups.innerHTML = errBlock("bilibili", data.error);
    return;
  }
  els.ups.innerHTML = list.map((u) => {
    const pic = (u.pic || "").replace(/^http:/, "https:");
    return `
      <li class="gcard">
        <a class="gthumb" href="${esc(u.url)}" target="_blank" rel="noopener">
          ${pic ? `<img src="${esc(pic)}" loading="lazy" onerror="this.remove()">` : `<span class="gthumb-ph">📺</span>`}
        </a>
        <div class="ginfo">
          <a class="gtitle" href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.title)}</a>
          <div class="gmeta">
            ${u.author ? `<span class="author">${esc(u.author)}</span>` : ""}
            ${u.created ? `<span class="time">${esc(fmtCreated(u.created))}</span>` : ""}
          </div>
        </div>
      </li>`;
  }).join("");
}

function renderArticles(data) {
  const isErr = data && typeof data === "object" && !Array.isArray(data) && data.error;
  const list = Array.isArray(data) ? data.filter((a) => !a.hidden) : [];
  const empty = list.length === 0;
  els.cardMp.style.display = (isErr || list.length > 0 || empty) ? "" : "none";
  if (isErr) {
    els.mpList.innerHTML = errBlock("mp", data.error);
    return;
  }
  if (empty) {
    // mp 为空时也保留卡片：云端（静态站）显示「仅本机采集」说明；
    // 本地则提示「今日暂无新推文」，避免公众号模块在网页上整个消失
    els.mpList.innerHTML = DAYS
      ? `<div class="module-note">📰 公众号推文仅在本机（微信解密环境）采集，云端不采集，故此处为空。</div>`
      : `<div class="module-note">📰 今日暂无新公众号推文。</div>`;
    return;
  }
  els.mpList.innerHTML = list.map((a) => {
    const pic = (a.pic || "").replace(/^http:/, "https:");
    return `
      <li class="gcard${a.notify ? " notify" : ""}">
        <a class="gthumb" href="${esc(a.url)}" target="_blank" rel="noopener">
          ${pic ? `<img src="${esc(pic)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : `<span class="gthumb-ph">📰</span>`}
        </a>
        <div class="ginfo">
          <a class="gtitle" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
          <div class="gmeta">
            ${a.author ? `<span class="author">${esc(a.author)}</span>` : ""}
            <span class="time">${a.notify ? "通知 · " : ""}${esc(a.time || "")}</span>
          </div>
        </div>
      </li>`;
  }).join("");
}

function render(data) {
  renderMusic(data.netease);
  renderBili(data.bilibili);
  renderArticles(data.mp);

  const hasData = (x) => (Array.isArray(x) && x.some((i) => !i.hidden)) ||
    (x && typeof x === "object" && !Array.isArray(x) && x.error);
  const any = hasData(data.netease) || hasData(data.bilibili) || hasData(data.mp);
  els.emptyState.style.display = any ? "none" : "";
  // 整日无任何记录（显示「该日暂无推送记录」）时，不再显示公众号说明卡片，避免重复提示
  if (!any) els.cardMp.style.display = "none";

  renderSummary(data);
}

function renderSummary(data) {
  const shown = (x) => (Array.isArray(x) ? x.filter((i) => !i.hidden).length : 0);
  const n = shown(data.netease);
  const mp = shown(data.mp);
  const bili = shown(data.bilibili);
  const stat = (target, label, val) => `
    <button class="stat" data-target="${target}"${val ? "" : " disabled"}>
      <div class="label">${label}</div><div class="value">${val}</div>
    </button>`;
  els.summary.innerHTML =
    stat("card-music", "🎵 推荐歌曲", n) +
    stat("card-bili", "👀 up动态", bili) +
    stat("card-mp", "📰 公众号推文", mp);
}

async function loadDay(date) {
  if (DAYS) {
    render(DAYS[date] || { netease: [], bilibili: [], mp: [] });
    return;
  }
  const d = await api("/api/day/" + date);
  if (d && typeof d === "object" && d.netease === undefined && d.bilibili === undefined
      && d.mp === undefined) {
    d.netease = null; d.bilibili = null; d.mp = null;
  }
  render(d);
}

function selectDate(ymd) {
  currentDate = ymd;
  els.datePicker.value = ymd;
  const btn = document.getElementById("dpButton");
  if (btn) btn.textContent = ymd;
  loadDay(ymd);
}

function buildDatePicker() {
  els.datePicker.style.display = "none";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.id = "dpButton";
  btn.className = "ghost";
  btn.textContent = currentDate;
  els.datePicker.insertAdjacentElement("beforebegin", btn);

  const popup = document.createElement("div");
  popup.id = "dpPopup";
  popup.innerHTML =
    `<div class="dp-head">
      <button type="button" class="ghost" data-dp="-12">«</button>
      <button type="button" class="ghost" data-dp="-1">◀</button>
      <span class="dp-label"></span>
      <button type="button" class="ghost" data-dp="1">▶</button>
      <button type="button" class="ghost" data-dp="12">»</button>
    </div>
    <div class="dp-grid"></div>`;
  els.datePicker.insertAdjacentElement("beforebegin", popup);

  const m = (currentDate || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  let view = m
    ? { y: +m[1], mo: +m[2] - 1 }
    : (() => { const d = new Date(); return { y: d.getFullYear(), mo: d.getMonth() }; })();

  const label = popup.querySelector(".dp-label");
  const grid = popup.querySelector(".dp-grid");
  const DOWS = ["一", "二", "三", "四", "五", "六", "日"];
  const todayStr = localDateStr();

  function render() {
    label.textContent = `${view.y} 年 ${view.mo + 1} 月`;
    const first = new Date(view.y, view.mo, 1);
    const lead = (first.getDay() + 6) % 7;
    const days = new Date(view.y, view.mo + 1, 0).getDate();
    const head = DOWS.map((d) => `<div class="dow">${d}</div>`).join("");
    let body = "";
    for (let i = 0; i < lead; i++) body += `<button type="button" class="out" tabindex="-1"></button>`;
    for (let d = 1; d <= days; d++) {
      const ymd = `${view.y}-${String(view.mo + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const wd = (first.getDay() + d - 1) % 7;
      const cls = [
        ymd === currentDate ? "selected" : "",
        ymd === todayStr ? "today" : "",
        wd === 0 || wd === 6 ? "weekend" : "",
      ].filter(Boolean).join(" ");
      body += `<button type="button" data-day="${d}" class="${cls}">${d}</button>`;
    }
    grid.innerHTML = head + body;
  }

  function toggle(open) {
    popup.classList.toggle("open", open);
    if (open) {
      render();
      const r = btn.getBoundingClientRect();
      const pw = popup.offsetWidth;
      let left = r.left + r.width / 2 - pw / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
      popup.style.left = left + "px";
      popup.style.top = (r.bottom + 8) + "px";
    }
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggle(!popup.classList.contains("open"));
  });

  popup.addEventListener("click", (e) => {
    const dir = e.target.getAttribute && e.target.getAttribute("data-dp");
    if (dir) {
      const mo = view.mo + (+dir);
      view = { y: view.y + Math.floor(mo / 12), mo: ((mo % 12) + 12) % 12 };
      render();
      return;
    }
    const day = e.target.getAttribute && e.target.getAttribute("data-day");
    if (day) {
      const ymd = `${view.y}-${String(view.mo + 1).padStart(2, "0")}-${String(+day).padStart(2, "0")}`;
      selectDate(ymd);
      toggle(false);
    }
  });

  document.addEventListener("click", (e) => {
    if (e.target !== btn && !popup.contains(e.target)) toggle(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") toggle(false);
  });
}

function shiftDate(days) {
  const ymd = (currentDate || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const dt = ymd ? new Date(+ymd[1], +ymd[2] - 1, +ymd[3]) : new Date();
  dt.setDate(dt.getDate() + days);
  const y = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  selectDate(`${y}-${mm}-${dd}`);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

async function init() {
  els.datePicker.value = currentDate;
  $("prevDay").addEventListener("click", () => shiftDate(-1));
  $("nextDay").addEventListener("click", () => shiftDate(1));
  buildDatePicker();

  if (els.collectBtn) {
    els.collectBtn.style.display = "none";
    els.collectMsg.style.display = "none";
  }

  const brandTitle = document.querySelector(".brand h1");
  if (brandTitle) brandTitle.textContent = "每日推送";

  const settingsLink = $("settingsLink");
  if (settingsLink && DAYS) settingsLink.style.display = "none";

  els.emptyState.textContent = "该日暂无推送记录，每日开机自动采集。";

  const biliTitle = document.querySelector("#card-bili h2");
  if (biliTitle) biliTitle.textContent = "📺 B站 UP动态";

  els.summary.addEventListener("click", (e) => {
    const btn = e.target.closest(".stat");
    if (!btn || btn.disabled) return;
    const card = $(btn.dataset.target);
    if (card && card.style.display !== "none") {
      const header = document.querySelector("header");
      const offset = (header ? header.offsetHeight : 0) + 12;
      const top = card.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
    }
  });

  const backTop = document.createElement("button");
  backTop.id = "backTop";
  backTop.className = "back-top";
  backTop.title = "回到顶部";
  backTop.setAttribute("aria-label", "回到顶部");
  backTop.textContent = "^";
  document.body.appendChild(backTop);
  window.addEventListener("scroll", () => {
    backTop.classList.toggle("show", window.scrollY > 0);
  }, { passive: true });
  backTop.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  const THEME_LOCATION = { lat: 39.9, lon: 116.4, tz: 8 };
  const THEME_AUTO = "auto";

  function sunTimes(date, lat, lon, tz) {
    const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    const N1 = Math.floor(275 * m / 9);
    const N2 = Math.floor((m + 9) / 12);
    const N3 = (1 + Math.floor((y - 4 * Math.floor(y / 4) + 2) / 3));
    const N = N1 - (N2 * N3) + d - 30;
    const lngHour = lon / 15;
    const zenith = 90.833;
    const d2r = Math.PI / 180;
    const solve = (kind) => {
      const t = N + ((kind === "rise" ? 6 : 18) - lngHour) / 24;
      const M = (0.9856 * t) - 3.289;
      const L = M + (1.916 * Math.sin(M * d2r)) + (0.020 * Math.sin(2 * M * d2r)) + 282.634;
      let RA = Math.atan(0.91764 * Math.tan(L * d2r)) / d2r;
      RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
      RA = RA / 15;
      const sinDec = 0.39782 * Math.sin(L * d2r);
      const cosDec = Math.cos(Math.asin(sinDec));
      let cosH = (Math.cos(zenith * d2r) - sinDec * Math.sin(lat * d2r))
        / (cosDec * Math.cos(lat * d2r));
      cosH = Math.max(-1, Math.min(1, cosH));
      let H = Math.acos(cosH) / d2r;
      if (kind === "rise") H = 360 - H;
      H = H / 15;
      const local = (H + RA - 0.06571 * t - 6.622 - lngHour + tz) % 24;
      const h = Math.floor(local);
      const mi = Math.round((local - h) * 60);
      const dateMs = new Date(y, m - 1, d, h, mi).getTime();
      return new Date(dateMs);
    };
    return { rise: solve("rise"), set: solve("set") };
  }

  function autoTheme() {
    const now = new Date();
    const { rise, set } = sunTimes(now, THEME_LOCATION.lat, THEME_LOCATION.lon, THEME_LOCATION.tz);
    return now >= rise && now < set ? "light" : "dark";
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeBtn.textContent = theme === "dark" ? "🌙" : "☀️";
  }

  const themeBtn = $("themeToggle");
  themeBtn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    localStorage.setItem("theme", next);
  });
  const savedTheme = localStorage.getItem("theme");
  applyTheme(savedTheme === null || savedTheme === THEME_AUTO ? autoTheme() : savedTheme);

  await loadDay(currentDate);
}

init();
</script>
</body>
</html>
